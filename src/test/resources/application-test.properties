# src/test/resources/application.properties
#
# No se fija quarkus.datasource.jdbc.url a propósito: Quarkus Dev Services
# levanta un Postgres efímero (Testcontainers) automáticamente para los tests.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Sin esto, quarkus-oidc intenta resolver un realm real al arrancar el test.
# @TestSecurity + @JwtSecurity toman el control completo de la identidad.
%test.quarkus.oidc.tenant-enabled=false