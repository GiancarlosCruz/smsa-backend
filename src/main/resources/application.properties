# ---- Datasource / Postgres ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:matricula}
quarkus.datasource.password=${DB_PASSWORD:matricula}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/matricula}

# El esquema lo controla Flyway, no Hibernate. En prod esto SIEMPRE debe ser "none".
quarkus.hibernate-orm.database.generation=update

# ---- Flyway ----
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ---- OIDC (Quarkus como resource server) ----
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:edu-superior}
quarkus.oidc.client-id=matricula-api
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${KEYCLOAK_API_CLIENT_ID:matricula-api}
quarkus.oidc.roles.role-claim-path=resource_access/matricula-web/roles

# ---- Keycloak Admin Client (usado por KeycloakProvisioningService) ----
# service-account del client "matricula-api" con rol "manage-users" en realm-management;
# evita usar credenciales de un usuario admin humano para esto.
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8180}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM:edu-superior}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_API_CLIENT_ID:matricula-api}
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:9A21ZTlkDx4sQlpiOu0ZqaCVGCCpGtgh}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# ---- OpenAPI / Swagger UI ----
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# ---- Observabilidad ----
quarkus.micrometer.export.prometheus.enabled=true
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true

# ---- Perfil dev: valores por defecto para correr local con docker-compose ----
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/matricula
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/edu-superior
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8180

# Habilitar trazas detalladas de autenticación y autorización
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.quarkus.oidc".level=DEBUG
quarkus.log.category."io.quarkus.resteasy".level=DEBUG

# Opcional: ver los claims que Quarkus extrae del JWT
quarkus.log.category."io.quarkus.oidc.runtime.OidcJsonWebTokenProducer".level=TRACE